# Usado SÓ nos testes. Este arquivo substitui o de src/main/resources enquanto os testes rodam,
# então nenhum teste (nem o contextLoads) conecta no Supabase. Nunca coloque aqui um banco real.
spring.application.name=api

spring.datasource.url=jdbc:h2:mem:testes;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

# O banco em memória nasce vazio a cada execução, então as tabelas são criadas e descartadas.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# Chave só de teste, nunca usada fora daqui.
jwt.secret=chave-somente-para-testes-0123456789-abcdef

# Paginação: ninguém pede mais de 100 itens por página (sem isso o limite é 2000).
spring.data.web.pageable.max-page-size=100
