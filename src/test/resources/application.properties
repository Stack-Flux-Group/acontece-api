# Usado SÓ nos testes. Este arquivo substitui o de src/main/resources enquanto os testes rodam,
# então nenhum teste (nem o contextLoads) conecta no Supabase. Nunca coloque aqui um banco real.
spring.application.name=api

spring.datasource.url=jdbc:h2:mem:testes;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

# O banco em memória nasce vazio a cada execução, então as tabelas são criadas e descartadas.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
