# Supabase (PostgreSQL na nuvem)
spring.datasource.url=jdbc:postgresql://aws-1-us-east-1.pooler.supabase.com:5432/postgres
spring.datasource.username=postgres.itbxjdfsvhwygalwytom
spring.datasource.password=rrjNfTNDX#VDqExxGs1q

# O pooler do Supabase no modo sessão aceita só 15 conexões por projeto.
# Sem limite, o Hikari abre 10 por instância e o deploy estoura o pool (EMAXCONNSESSION).
spring.datasource.hikari.maximum-pool-size=3

# Continua criando/atualizando as tabelas sozinho, agora no Supabase
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Origens do front-end liberadas no CORS (separadas por vírgula)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,https://acontece.netlify.app}


# Login (JWT). JWT_SECRET é obrigatório: mínimo 32 caracteres, sem valor padrão de propósito.
jwt.secret=${JWT_SECRET:}
jwt.expiracao-minutos=${JWT_EXPIRACAO_MINUTOS:120}

# Primeiro organizador, criado na subida se ainda não existir (ambas obrigatórias para criar)
organizador.email=${ORGANIZADOR_EMAIL:}
organizador.senha=${ORGANIZADOR_SENHA:}
organizador.nome=${ORGANIZADOR_NOME:Organizador}
