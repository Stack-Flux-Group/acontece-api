# Supabase (PostgreSQL na nuvem)
# Porta 6543 = pooler em modo TRANSAÇÃO: aceita muito mais clientes que o modo
# sessão (5432, limitado a 15 por projeto, que estourava com EMAXCONNSESSION).
# prepareThreshold=0 é obrigatório: prepared statements nomeados não sobrevivem
# à troca de conexão que o pooler faz a cada transação.
spring.datasource.url=jdbc:postgresql://aws-1-us-east-1.pooler.supabase.com:6543/postgres?prepareThreshold=0
spring.datasource.username=postgres.itbxjdfsvhwygalwytom
spring.datasource.password=rrjNfTNDX#VDqExxGs1q

# Pool pequeno por instância: sobra espaço no pooler pra instância velha + nova
# durante deploy e pra quem roda o app localmente com a mesma credencial.
spring.datasource.hikari.maximum-pool-size=3

# Continua criando/atualizando as tabelas sozinho, agora no Supabase
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Origens do front-end liberadas no CORS (separadas por vírgula)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,https://acontece.netlify.app}


# ViaCEP: sem isso o Feign espera até 60s por resposta. Em milissegundos.
spring.cloud.openfeign.client.config.viacep.connect-timeout=3000
spring.cloud.openfeign.client.config.viacep.read-timeout=5000

# Login (JWT). JWT_SECRET é obrigatório: mínimo 32 caracteres, sem valor padrão de propósito.
jwt.secret=${JWT_SECRET:}
jwt.expiracao-minutos=${JWT_EXPIRACAO_MINUTOS:120}

# Primeiro organizador, criado na subida se ainda não existir (ambas obrigatórias para criar)
organizador.email=${ORGANIZADOR_EMAIL:}
organizador.senha=${ORGANIZADOR_SENHA:}
organizador.nome=${ORGANIZADOR_NOME:Organizador}

# Paginação: ninguém pede mais de 100 itens por página (sem isso o limite é 2000).
spring.data.web.pageable.max-page-size=100
